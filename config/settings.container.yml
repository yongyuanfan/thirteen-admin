application:
  mode: prod
  name: thirteen-admin
  http:
    enabled: true
    host: 0.0.0.0
    port: 8080
  jwt:
    secret: your-jwt-secret
    expires_in: 1800
    refresh_expires_in: 604800
    auto_refresh_token: true
    auto_revoke_token: true
  logging:
    enabled: true
    level: info
    file_path: runtime/logs/thirteen-admin.log
  database:
    driver: mysql
    mysql:
      host: mysql-server
      port: 3306
      user: root
      password: 123456
      database: thirteen-admin
      charset: utf8mb4
    postgres:
      host: postgres-server
      port: 5432
      user: root
      password: 123456
      database: thirteen-admin
  cache:
    driver: redis
    file:
      path: runtime/cache
    redis:
      host: redis-server
      port: 6379
      password: 123456
      db: 0
