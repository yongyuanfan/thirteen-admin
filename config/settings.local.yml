application:
  mode: dev
  name: clash-admin
  http:
    enabled: true
    host: 0.0.0.0
    port: 8080
  jwt:
    secret: local-test-jwt-secret
    expires_in: 7200
    refresh_expires_in: 604800
  logging:
    enabled: true
    level: info
    file_path: runtime/logs/clash-admin.log
  storage:
    mysql:
      enabled: true
      host: localhost
      port: 3306
      user: root
      password: 123456
      database: clash-admin
      charset: utf8mb4
    redis:
      enabled: true
      host: localhost
      port: 6379
      password: 123456
      db: 0
    postgres:
      enabled: false
      host: localhost
      port: 5432
      user: root
      password: 123456
      database: clash-admin
